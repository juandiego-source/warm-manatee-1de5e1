# Deploy job-comms with the gateway JWT check off. The function checks
# the signed-in user itself, and the 6pm/7pm jobs authenticate with
# CRON_SECRET. See the header of supabase/functions/job-comms/index.ts.
[functions.job-comms]
verify_jwt = false

# Resend calls this with a Svix signature, not a Supabase JWT.
[functions.resend-webhook]
verify_jwt = false
