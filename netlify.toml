# A client's approve link is /q/<token> (and older emails use /?quote=<token>).
# That page is rendered by the public-quote function, with no login.
# Every other path is the staff app.
[[redirects]]
  from = "/"
  query = {quote = ":token"}
  to = "/q/:token"
  status = 302
  force = true

[[redirects]]
  from = "/quote/:token"
  to = "/q/:token"
  status = 302
  force = true

[[redirects]]
  from = "/q/*"
  to = "/.netlify/functions/public-quote"
  status = 200
  force = true

# History routes (/estimates/EST-0015, /jobs/SMK-97456, …) are handled in the app.
# Serve index.html for any path that is not a real file so refresh does not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The app is one HTML file with an inline script, so the content security
# policy allows unsafe-inline. It is report-only until the office has watched
# a real session. Camera stays available for the photo file picker.
# Geolocation is unused.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.jsdelivr.net https://nrnnpprcshkgroghhbro.supabase.co; connect-src 'self' https://nrnnpprcshkgroghhbro.supabase.co wss://nrnnpprcshkgroghhbro.supabase.co https://checkout.stripe.com; frame-src https://checkout.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; object-src 'none'; worker-src 'self' blob:; manifest-src 'self' data:"
